server:
  port: 8087
spring:
  application:
    name: fintech-operations-capstone
  datasource:
    url: jdbc:postgresql://localhost:5432/fintech
    username: fintech
    password: fintech_local_only
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
management:
  endpoints:
    web:
      exposure:
        include: health,info
