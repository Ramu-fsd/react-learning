server:
  port: 8084
spring:
  application:
    name: learning-api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/customers/**
        - id: account-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/accounts/**
